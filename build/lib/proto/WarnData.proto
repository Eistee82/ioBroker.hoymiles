syntax = "proto3";
message WarnMO {
    int64 pv_sn = 1;
    int32 code = 2;
    int32 num = 3;
    int32 s_time = 4;
    int32 e_time = 5;
    int32 w_data1 = 6;
    int32 w_data2 = 7;
}
message WarnReqDTO {
    string dtu_sn = 1;
    int32 time = 2;
    int32 package_nub = 3;
    int32 package_now = 4;
    int32 warn_device = 5;
    repeated WarnMO warns = 6;
}

// App -> DTU request for a single warn-list package (paginated pull). The DTU answers
// with a WarnReqDTO carrying package_now/package_nub. Field numbers verified against the
// S-Miles app (WarnData.WarnResDTO): ymd_hms=1, package_now=2, offset=4, time=5.
message WarnResDTO {
    bytes ymd_hms = 1;
    int32 package_now = 2;
    int32 offset = 4;
    int32 time = 5;
}
